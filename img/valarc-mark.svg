<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Valarc mark">
  <rect width="64" height="64" rx="15" fill="#0B1640"/>
  <!-- the arch (al-valarc: the bridge) -->
  <path d="M17 50 V31 a15 15 0 0 1 30 0 V39" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- the tail: a market up-tick crossing the bridge -->
  <path d="M31 41 L39 49 L52 33" fill="none" stroke="#F2A93B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- keystone -->
  <circle cx="32" cy="16" r="3.2" fill="#F2A93B"/>
</svg>
